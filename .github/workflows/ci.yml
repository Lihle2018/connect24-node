name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the package declares, because that is where global fetch arrived.
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The samples are part of the contract: each ships with tests that drive the real
      # SDK over a stubbed transport, and they must stay green with the SDK they sit on.
      - name: Sample tests
        working-directory: samples/order-notifications
        run: |
          npm install --no-audit --no-fund
          npm test
